name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: macos-26
    env:
      SWIFTLY_VERSION: "1.1.3"
    permissions:
      contents: write  # Required to create GitHub releases
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Swift with Swiftly
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://download.swift.org/swiftly/darwin/swiftly-${SWIFTLY_VERSION}.pkg" \
            --output "$RUNNER_TEMP/swiftly.pkg"
          installer -pkg "$RUNNER_TEMP/swiftly.pkg" -target CurrentUserHomeDirectory
          "$HOME/.swiftly/bin/swiftly" init --assume-yes --skip-install --no-modify-profile
          source "$HOME/.swiftly/env.sh"
          swiftly install --assume-yes
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"
          hash -r
          swift --version
          swift --version | grep -F "Swift version $(tr -d '[:space:]' < .swift-version)"
        
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swift-${{ hashFiles('.swift-version') }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-${{ hashFiles('.swift-version') }}-spm-
            
      - name: Build Release
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          ./scripts/set-version.sh "$VERSION"
          swift build -c release --product focusrelay
          ./scripts/check-bridge-only-architecture.sh .build/release/focusrelay
        
      - name: Package Release
        id: package
        run: |
          set -euo pipefail
          ./scripts/test-release-package-outputs.sh
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi

          PACKAGE_OUTPUT_FILE="$RUNNER_TEMP/focusrelay-package-output.txt"
          ./scripts/package-release.sh "$VERSION" "$PWD" | tee "$PACKAGE_OUTPUT_FILE"
          ./scripts/write-github-package-outputs.sh "$PACKAGE_OUTPUT_FILE" "$GITHUB_OUTPUT"
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.package.outputs.tag_name }}
          name: ${{ steps.package.outputs.tag_name }}
          files: |
            focusrelay-*.tar.gz
            focusrelay-*.sha256
          fail_on_unmatched_files: true
          body_path: docs/release-notes-v0.12.0-beta.md
          draft: false
          prerelease: ${{ contains(steps.package.outputs.version, '-') || contains(steps.package.outputs.version, 'alpha') || contains(steps.package.outputs.version, 'beta') || contains(steps.package.outputs.version, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
